<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0B1F3A" />
  <title>KampüsteyimAPP · Açılıyor…</title>
  <link rel="icon" href="./kampusteyim_icon.png" type="image/png" />
  <script>
(function () {
  var PACKAGE = 'com.aystech.kampusteyimapp';
  var HOST = 'app.kampusteyim.app';
  var IOS_STORE = 'https://apps.apple.com/tr/app/id6793663176';
  var PLAY = 'https://play.google.com/store/apps/details?id=' + PACKAGE;
  var DOWNLOAD = 'https://kampusteyim.app/#indir';

  function parsePath() {
    var raw = location.pathname || '/';
    var q = location.search || '';
    var path = '';
    if (/^\/t\/[^/]+/.test(raw)) {
      var uname = decodeURIComponent(raw.split('/')[2] || '').replace(/^@/, '');
      path = '/user/' + uname + (q && q !== '?' ? q + '&src=promo' : '?src=promo');
      if (path.indexOf('src=promo') < 0) path += (path.indexOf('?') >= 0 ? '&' : '?') + 'src=promo';
      return path;
    }
    path = new URLSearchParams(location.search).get('path') || '/';
    if (path.charAt(0) !== '/') path = '/' + path;
    if (/^\/t\/[^/?#]+/.test(path)) {
      var tUser = decodeURIComponent(path.split('/')[2] || '').replace(/^@/, '');
      path = '/user/' + tUser + (path.indexOf('?') >= 0 ? path.slice(path.indexOf('?')) : '?src=promo');
      if (path.indexOf('src=promo') < 0) path += (path.indexOf('?') >= 0 ? '&' : '?') + 'src=promo';
    }
    if (!/^\/(post|user|event|announcement|stories|reels|tickets|home|profile|search|about)(\/|$)/.test(path)
        && path !== '/reels' && path !== '/tickets' && path !== '/home' && path !== '/profile' && path !== '/search' && path !== '/about') {
      path = '/home';
    }
    return path;
  }

  var path = parsePath();
  var ua = navigator.userAgent || '';
  var isIOS = /iphone|ipad|ipod/i.test(ua) || (/macintosh/i.test(ua) && 'ontouchend' in document);
  var isAndroid = /android/i.test(ua);
  if (path.indexOf('via=web') < 0) {
    path += (path.indexOf('?') >= 0 ? '&' : '?') + 'via=web';
  }
  window.__ktPath = path;
  window.__ktIOS = isIOS;
  window.__ktAndroid = isAndroid;
  window.__ktStore = isIOS ? IOS_STORE : (isAndroid ? PLAY : DOWNLOAD);

  var TRACK_URL = 'https://europe-west1-ayskampuss.cloudfunctions.net/trackPromoScan';
  var um = path.match(/^\/user\/([^/?#]+)/);
  var promo = /[?&]src=promo/.test(path) || /^\/t\//.test(location.pathname);
  if (promo && um) {
    var plat = isIOS ? 'ios' : (isAndroid ? 'android' : 'other');
    var src = TRACK_URL + '?redirect=0&source=promo_card&username=' + encodeURIComponent(decodeURIComponent(um[1])) + '&platform=' + plat;
    try { new Image().src = src; } catch (e) {}
  }

  if (!isIOS && !isAndroid) return;

  // Uygulamayı aç — tarama sayacı yukarıda tetiklendi.
  location.href = 'kampusteyim://open' + path;
  if (isAndroid) {
    setTimeout(function () {
      if (document.hidden) return;
      location.href =
        'intent://' + HOST + path +
        '#Intent;scheme=https;package=' + PACKAGE +
        ';S.browser_fallback_url=' + encodeURIComponent(window.__ktStore) +
        ';end';
    }, 80);
  }
})();
  </script>
  <style>
    :root {
      --navy: #0B1F3A;
      --cyan: #00D4C8;
      --font: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font);
      color: #fff;
      background:
        radial-gradient(ellipse 70% 50% at 20% 30%, rgba(0, 212, 200, 0.28), transparent 55%),
        linear-gradient(155deg, #061426 0%, #0B1F3A 55%, #123456 100%);
      padding: 1.5rem;
      text-align: center;
    }
    .card { max-width: 22rem; width: 100%; }
    .logo {
      width: 72px; height: 72px; border-radius: 18px;
      margin: 0 auto 1.1rem; box-shadow: 0 12px 36px rgba(0,0,0,.35);
    }
    h1 { font-size: 1.45rem; font-weight: 800; margin: 0 0 .4rem; letter-spacing: -.02em; }
    h1 span { color: var(--cyan); }
    p { margin: 0 0 1rem; color: rgba(255,255,255,.72); font-size: .95rem; line-height: 1.4; }
    .btn {
      display: block; width: 100%;
      border: 0; border-radius: 14px;
      padding: .95rem 1rem; margin: .55rem 0 0;
      font-weight: 700; font-size: .98rem; cursor: pointer;
      text-decoration: none; color: #061426; background: var(--cyan);
    }
    .btn.secondary {
      background: rgba(255,255,255,.12); color: #fff;
      border: 1px solid rgba(255,255,255,.28);
    }
    .hint { margin-top: 1rem; font-size: .8rem; color: rgba(255,255,255,.5); }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="./kampusteyim_icon.png" width="72" height="72" alt="KampüsteyimAPP" />
    <h1>Kampüsteyim<span>APP</span></h1>
    <p id="status">Uygulama açılıyor…</p>
    <a class="btn" id="store" href="https://kampusteyim.app/#indir">Uygulamayı indir</a>
    <a class="btn secondary" id="web" href="/">Web’de devam et</a>
    <p class="hint">Uygulama yüklüyse hemen açılır. Yoksa App Store / Play Store’a yönlendirilirsin.</p>
  </div>
  <script>
(function () {
  var PROMO_URL = 'https://europe-west1-ayskampuss.cloudfunctions.net/getPromoPublic';
  var path = window.__ktPath || '/home';
  var isIOS = !!window.__ktIOS;
  var isAndroid = !!window.__ktAndroid;
  var storeUrl = window.__ktStore || 'https://kampusteyim.app/#indir';
  var gone = false;

  var storeBtn = document.getElementById('store');
  var webBtn = document.getElementById('web');
  var statusEl = document.getElementById('status');
  storeBtn.href = storeUrl;
  storeBtn.textContent = isIOS ? 'App Store’dan indir' : (isAndroid ? 'Google Play’den indir' : 'İndirme sayfasına git');
  webBtn.href = path + (location.hash || '');
  webBtn.addEventListener('click', function () {
    try { sessionStorage.setItem('kt_web_continue', '1'); } catch (e) {}
  });

  window.addEventListener('pagehide', function () { gone = true; });
  window.addEventListener('blur', function () { gone = true; });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) gone = true;
  });

  function isAppStore(u) {
    return /^https?:\/\/(?:[a-z0-9-]+\.)*(?:apps\.apple\.com|itunes\.apple\.com)\//i.test(String(u || ''));
  }
  function isPlay(u) {
    var s = String(u || '');
    return /^https?:\/\/play\.google\.com\//i.test(s) || /^market:\/\//i.test(s);
  }

  fetch(PROMO_URL, { method: 'GET' })
    .then(function (r) { return r.json(); })
    .then(function (cfg) {
      if (!cfg || !cfg.ok) return;
      if (isIOS && isAppStore(cfg.iosUrl || cfg.appStoreUrl)) storeUrl = cfg.iosUrl || cfg.appStoreUrl;
      else if (isAndroid && isPlay(cfg.androidUrl || cfg.playStoreUrl)) storeUrl = cfg.androidUrl || cfg.playStoreUrl;
      else if (!isIOS && !isAndroid) storeUrl = cfg.downloadSectionUrl || storeUrl;
      storeBtn.href = storeUrl;
    })
    .catch(function () {});

  if (!isIOS && !isAndroid) {
    location.replace(path);
    return;
  }

  // Uygulama açılmazsa mağazaya düş — Flutter’a geri dönme.
  setTimeout(function () {
    if (gone || document.hidden) return;
    statusEl.textContent = 'Uygulama bulunamadı · indirmeye yönlendiriliyor…';
    location.replace(storeUrl);
  }, isAndroid ? 1100 : 900);
})();
  </script>
</body>
</html>
