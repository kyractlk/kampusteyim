<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="KampüsteyimAPP — kampüs sosyal ağı. AYS Tech.">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="KampüsteyimAPP">

  <link rel="icon" type="image/png" sizes="192x192" href="/kampusteyim_icon.png?v=4">
  <link rel="icon" type="image/png" href="/kampusteyim_icon.png?v=4">
  <link rel="shortcut icon" href="/kampusteyim_icon.png?v=4">
  <link rel="apple-touch-icon" href="/kampusteyim_icon.png?v=4">
  <link rel="apple-touch-icon" sizes="192x192" href="/icons/Icon-192.png?v=3">

  <title>KampüsteyimAPP</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    html, body { height: 100%; margin: 0; background: #000000; }
    #boot {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 14px; color: #E8F1F8; font-family: system-ui, sans-serif;
      z-index: 9999; transition: opacity .28s ease; background: #000000;
    }
    #boot.fade { opacity: 0; pointer-events: none; }
    #boot img {
      width: 88px; height: 88px; border-radius: 18px;
      box-shadow: 0 8px 28px rgba(0,0,0,.45);
      object-fit: cover;
    }
    #boot .spin {
      width: 22px; height: 22px; border: 2px solid rgba(255,255,255,.22);
      border-top-color: #00D4C8; border-radius: 50%; animation: s 0.8s linear infinite;
      opacity: 0; transition: opacity .2s;
    }
    #boot.show-wait .spin { opacity: 1; }
    #boot .label {
      font-weight: 600; font-size: 13px; letter-spacing: .02em; opacity: 0;
      transition: opacity .2s;
    }
    #boot.show-wait .label { opacity: .75; }
    @keyframes s { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="boot">
    <img src="/kampusteyim_icon.png" alt="KampüsteyimAPP" width="88" height="88">
    <div class="spin" aria-hidden="true"></div>
    <div class="label">KampüsteyimAPP</div>
  </div>
  <script>
    // Mobil derin link: yalnızca dışarıdan gelen ilk girişte uygulama dene.
    // F5 / geri-ileri / aynı siteden gezinti web’de kalsın.
    (function () {
      function stayOnWeb() {
        try { sessionStorage.setItem('kt_web_continue', '1'); } catch (e) {}
      }
      try {
        if (sessionStorage.getItem('kt_web_continue') === '1') return;
        if (localStorage.getItem('kt_prefer_web') === '1') {
          stayOnWeb();
          return;
        }
      } catch (e) {}
      var nav = (performance.getEntriesByType &&
        performance.getEntriesByType('navigation')[0]) || {};
      if (nav.type === 'reload' || nav.type === 'back_forward') {
        stayOnWeb();
        return;
      }
      var raw = location.pathname || '/';
      if (!/^\/(post|user|event|announcement|stories|reels|tickets|t)(\/|$)/.test(raw)) {
        stayOnWeb();
        return;
      }
      if (/[?&]via=web\b/.test(location.search || '')) {
        stayOnWeb();
        return;
      }
      try {
        if (document.referrer) {
          var refHost = new URL(document.referrer).host;
          if (refHost === location.host) {
            stayOnWeb();
            return;
          }
        }
      } catch (e) {}
      var ua = navigator.userAgent || '';
      var mobile = /iphone|ipad|ipod|android/i.test(ua) ||
        (/macintosh/i.test(ua) && 'ontouchend' in document);
      if (!mobile) {
        stayOnWeb();
        return;
      }
      var dest = raw;
      var extra = location.search || '';
      if (/^\/t\/[^/]+/.test(raw)) {
        var uname = decodeURIComponent(raw.split('/')[2] || '').replace(/^@/, '');
        dest = '/user/' + uname;
        extra = extra && extra !== '?' ? extra + '&src=promo' : '?src=promo';
      }
      var q = dest + extra + (location.hash || '');
      location.replace('/deeplink.html?path=' + encodeURIComponent(q));
    })();
  </script>
  <script>
    (function () {
      var boot = document.getElementById('boot');
      var removed = false;
      function hideBoot() {
        if (removed || !boot) return;
        removed = true;
        boot.classList.add('fade');
        setTimeout(function () {
          if (boot && boot.parentNode) boot.parentNode.removeChild(boot);
        }, 300);
      }
      setTimeout(function () {
        if (!removed && boot) boot.classList.add('show-wait');
      }, 1200);
      window.addEventListener('flutter-first-frame', hideBoot);
      setTimeout(hideBoot, 3500);
    })();
  </script>
  <script>
    // Eski SW / Cache Storage hashed asset ister → SPA rewrite HTML döner →
    // "unsupported MIME type ('text/html')". Önce temizle, sonra boot.
    (function () {
      function bootFlutter() {
        var s = document.createElement('script');
        s.src = '/flutter_bootstrap.js';
        s.async = true;
        document.body.appendChild(s);
      }
      var tasks = [];
      if ('serviceWorker' in navigator) {
        tasks.push(
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (reg) {
              var script =
                (reg.active && reg.active.scriptURL) ||
                (reg.waiting && reg.waiting.scriptURL) ||
                (reg.installing && reg.installing.scriptURL) ||
                '';
              // FCM arka plan bildirimi bu SW’ye bağlı; silinmesin.
              if (/firebase-messaging-sw\.js/i.test(script)) {
                return Promise.resolve();
              }
              return reg.unregister().catch(function () {});
            }));
          }).catch(function () {})
        );
      }
      if (window.caches && caches.keys) {
        tasks.push(
          caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) {
              return caches.delete(k).catch(function () {});
            }));
          }).catch(function () {})
        );
      }
      Promise.all(tasks).then(bootFlutter).catch(bootFlutter);
    })();
  </script>
</body>
</html>
