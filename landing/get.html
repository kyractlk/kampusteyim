<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0B1F3A" />
  <title>KampüsteyimAPP · Yönlendiriliyor…</title>
  <link rel="icon" href="./kampusteyim_icon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #0B1F3A;
      --navy-deep: #061426;
      --cyan: #00D4C8;
      --lime: #89C741;
      --font-display: "Syne", system-ui, sans-serif;
      --font-body: "Instrument Sans", system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      overflow-x: hidden;
    }
    body {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-body);
      color: #fff;
      background:
        radial-gradient(ellipse 70% 50% at 20% 30%, rgba(0, 212, 200, 0.28), transparent 55%),
        radial-gradient(ellipse 60% 45% at 85% 20%, rgba(137, 199, 65, 0.2), transparent 50%),
        linear-gradient(155deg, #061426 0%, #0B1F3A 50%, #123456 100%);
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      max-width: 22rem;
    }
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      margin: 0 auto 1.25rem;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.35);
      animation: float 2.8s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    h1 {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(1.35rem, 5vw, 1.65rem);
      letter-spacing: -0.03em;
      margin: 0 0 0.5rem;
      line-height: 1.2;
    }
    h1 span { color: var(--cyan); }
    .status {
      margin: 0;
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.98rem;
      font-weight: 500;
    }
    .dots::after {
      content: "";
      animation: dots 1.2s steps(4, end) infinite;
    }
    @keyframes dots {
      0% { content: ""; }
      25% { content: "."; }
      50% { content: ".."; }
      75% { content: "..."; }
    }
    .fallback {
      margin-top: 1.5rem;
      font-size: 0.88rem;
    }
    .fallback a {
      color: var(--cyan);
      font-weight: 600;
      text-decoration: none;
    }
    .fallback a:hover { text-decoration: underline; }
    @media (prefers-reduced-motion: reduce) {
      .logo, .dots::after { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="card" role="status" aria-live="polite">
    <img class="logo" src="./kampusteyim_icon.png" width="72" height="72" alt="KampüsteyimAPP" />
    <h1>Kampüsteyim<span>APP</span></h1>
    <p class="status">Yönlendiriliyor<span class="dots" aria-hidden="true"></span></p>
    <p class="fallback">
      <a id="manual" href="https://kampusteyim.app/#indir">İndirme sayfasına git</a>
    </p>
  </div>

  <script>
(function () {
  const TRACK_URL = 'https://europe-west1-ayskampuss.cloudfunctions.net/trackPromoScan';
  const PROMO_URL = 'https://europe-west1-ayskampuss.cloudfunctions.net/getPromoPublic';
  const IOS_STORE = 'https://apps.apple.com/tr/app/id6793663176';
  const DOWNLOAD_SECTION = 'https://kampusteyim.app/#indir';
  const CONFIG_WAIT_MS = 900;

  const ua = navigator.userAgent || '';
  let platform = 'other';
  if (/iphone|ipad|ipod/i.test(ua) || (/macintosh/i.test(ua) && 'ontouchend' in document)) {
    platform = 'ios';
  } else if (/android/i.test(ua)) {
    platform = 'android';
  }

  function isAppStoreLink(u) {
    return /^https?:\/\/(?:[a-z0-9-]+\.)*(?:apps\.apple\.com|itunes\.apple\.com)\//i.test(
      String(u || '').trim(),
    );
  }
  function isPlayStoreLink(u) {
    const s = String(u || '').trim();
    return /^https?:\/\/play\.google\.com\//i.test(s) || /^market:\/\//i.test(s);
  }

  function bakedTarget() {
    if (platform === 'ios') return IOS_STORE;
    return DOWNLOAD_SECTION;
  }

  function pickFromConfig(cfg) {
    if (!cfg) return bakedTarget();
    if (platform === 'ios') {
      const ios = cfg.iosUrl || cfg.appStoreUrl;
      return isAppStoreLink(ios) ? ios : IOS_STORE;
    }
    if (platform === 'android') {
      const play = cfg.androidUrl || cfg.playStoreUrl;
      return isPlayStoreLink(play) ? play : DOWNLOAD_SECTION;
    }
    return cfg.downloadSectionUrl || DOWNLOAD_SECTION;
  }

  const manual = document.getElementById('manual');
  manual.href = bakedTarget();
  manual.textContent = platform === 'ios' ? 'App Store’a git' : 'İndirme sayfasına git';

  let redirected = false;
  function go(url) {
    if (redirected) return;
    redirected = true;
    location.replace(String(url || '').trim() || bakedTarget());
  }

  // Tarama sayacı yönlendirmeyi bloklamasın.
  try {
    const payload = JSON.stringify({ platform, source: 'qr', ua: ua.slice(0, 240) });
    if (navigator.sendBeacon) {
      navigator.sendBeacon(TRACK_URL, new Blob([payload], { type: 'application/json' }));
    } else {
      fetch(TRACK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: payload,
        keepalive: true,
        mode: 'cors',
      }).catch(function () {});
    }
  } catch (_) {}

  // Admin linkini kısa süre bekle; gelmezse platforma göre sabit hedefe git.
  const timer = setTimeout(function () {
    go(bakedTarget());
  }, CONFIG_WAIT_MS);

  const ctrl = new AbortController();
  setTimeout(function () {
    try {
      ctrl.abort();
    } catch (_) {}
  }, CONFIG_WAIT_MS);

  fetch(PROMO_URL, { method: 'GET', signal: ctrl.signal })
    .then(function (r) {
      return r.json();
    })
    .then(function (data) {
      clearTimeout(timer);
      go(pickFromConfig(data && data.ok ? data : null));
    })
    .catch(function () {
      clearTimeout(timer);
      go(bakedTarget());
    });
})();
  </script>
</body>
</html>
