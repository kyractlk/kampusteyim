# Windows'tan iOS: Codemagic bulut Mac
# Team: 8496F2PR53 · Bundle: com.aystech.mtMobil
# SPM kapalı → CocoaPods (permission_handler Podfile flags)
# İmza: ios_code_signing grubunda CERTIFICATE_PRIVATE_KEY (Ad Hoc + App Store)
#
# KRİTİK: App Store’a yalnızca --release IPA.
# Debug IPA home screen’den açılmaz (Guideline 2.1) ve
# iOS 26.5 ProMotion’da VSyncClient ile çöker (#187565).

workflows:
  # NOT: ios_signing BLOĞU YOK — yoksa Codemagic hazır profil arar ve
  # "No matching profiles found ... app_store" ile düşer.
  # Profil + Distribution cert: CERTIFICATE_PRIVATE_KEY ile --create.
  ios-app-store:
    name: KampusteyimAPP iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: AYSCODEMAGIC
    environment:
      groups:
        - ios_code_signing
      vars:
        BUNDLE_ID: com.aystech.mtMobil
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Disable Swift Package Manager (use CocoaPods)
        script: |
          flutter config --no-enable-swift-package-manager
      - name: Create App Store cert + profile
        script: |
          set -e
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "ERROR: CERTIFICATE_PRIVATE_KEY eksik."
            echo "Codemagic → Environment variables → Group: ios_code_signing"
            echo "  Name: CERTIFICATE_PRIVATE_KEY (Secure)"
            echo "  Value: ios/signing/certificate_private_key.pem içeriği"
            exit 1
          fi
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles
          echo "App Store signing ready"
      - name: Flutter pub get
        script: |
          flutter clean
          flutter pub get
          flutter --version
      - name: CocoaPods install
        script: |
          cd ios
          rm -rf Pods Podfile.lock .symlinks
          pod install --repo-update
      - name: Build number
        script: |
          # App Store’da son yüklenen cfBundleVersion’dan yüksek olmalı
          BN="${BUILD_NUMBER:-31}"
          if [ "$BN" -le 30 ]; then BN=31; fi
          sed -i '' -E "s/^version: ([0-9]+\.[0-9]+\.[0-9]+)\+.*/version: \1+$BN/" pubspec.yaml
          grep '^version:' pubspec.yaml
      - name: Flutter IPA RELEASE only
        script: |
          set -e
          echo "Building RELEASE IPA (never Debug)…"
          if grep -q "UIApplicationSceneManifest" ios/Runner/Info.plist; then
            echo "ERROR: UIApplicationSceneManifest still in Info.plist"
            exit 1
          fi
          if [ ! -f ios/Runner/PrivacyInfo.xcprivacy ]; then
            echo "ERROR: PrivacyInfo.xcprivacy missing"
            exit 1
          fi
          if ! grep -q "PrivacyInfo.xcprivacy in Resources" ios/Runner.xcodeproj/project.pbxproj; then
            echo "ERROR: PrivacyInfo.xcprivacy not in Xcode Resources"
            exit 1
          fi
          if ! grep -q "installTouchRateCorrectionNoOp\|touch-rate VSync" ios/Runner/AppDelegate.swift; then
            echo "ERROR: ProMotion VSync workaround missing from AppDelegate"
            exit 1
          fi
          flutter build ipa --release \
            --no-tree-shake-icons \
            --export-options-plist=/Users/builder/export_options.plist
          IPA=$(ls -1 build/ios/ipa/*.ipa | head -1)
          echo "IPA: $IPA"
          if unzip -l "$IPA" | grep -q 'kernel_blob.bin'; then
            echo "ERROR: Debug kernel_blob.bin in IPA — aborting"
            exit 1
          fi
          if ! unzip -l "$IPA" | grep -q 'PrivacyInfo.xcprivacy'; then
            echo "ERROR: PrivacyInfo.xcprivacy not inside IPA"
            exit 1
          fi
          echo "Release IPA OK — TestFlight upload next"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - alikayracatalkaya321@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  # Telefona manuel kurulum (TestFlight olmadan) — Ad Hoc
  # Cihaz: Kayra iPhone 15 Plus · UDID ios/devices/adhoc_udids.txt
  # NOT: ios_signing BLOĞU YOK — yoksa Codemagic hazır profil arar ve
  # "No matching profiles found ... ad_hoc" ile düşer. Profil --create ile üretilir.
  ios-ad-hoc:
    name: KampusteyimAPP iOS → Ad Hoc (cihazına kur)
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: AYSCODEMAGIC
    environment:
      groups:
        - ios_code_signing
      vars:
        BUNDLE_ID: com.aystech.mtMobil
        DEVICE_UDID: 00008120-000631242151A01E
        DEVICE_NAME: Kayra-iPhone15-Plus
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Register test device
        script: |
          set +e
          app-store-connect devices register \
            --name "$DEVICE_NAME" \
            --udid "$DEVICE_UDID"
          echo "device register status=$?"
          set -e
      - name: Disable SPM
        script: flutter config --no-enable-swift-package-manager
      - name: Create Ad Hoc cert + profile
        script: |
          set -e
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "ERROR: CERTIFICATE_PRIVATE_KEY eksik."
            echo "Codemagic → Environment variables → Group: ios_code_signing"
            echo "  Name: CERTIFICATE_PRIVATE_KEY (Secure)"
            echo "  Value: ios/signing/certificate_private_key.pem içeriği"
            echo "codemagic.yaml environment.groups içinde ios_code_signing olmalı."
            exit 1
          fi
          keychain initialize
          # Mevcut Distribution cert'lerin private key'i bu Mac'te yok →
          # bu PEM ile yeni/uyumlu cert + Ad Hoc profil oluştur.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_ADHOC \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles
          echo "Signing files ready"
      - name: Flutter pub get
        script: |
          flutter clean
          flutter pub get
      - name: CocoaPods
        script: |
          cd ios
          rm -rf Pods Podfile.lock .symlinks
          pod install --repo-update
      - name: Build number
        script: |
          BN="${BUILD_NUMBER:-14}"
          if [ "$BN" -le 13 ]; then BN=14; fi
          sed -i '' -E "s/^version: ([0-9]+\.[0-9]+\.[0-9]+)\+.*/version: \1+$BN/" pubspec.yaml
          grep '^version:' pubspec.yaml
      - name: Flutter Ad Hoc RELEASE IPA
        script: |
          set -e
          flutter build ipa --release \
            --no-tree-shake-icons \
            --export-options-plist=/Users/builder/export_options.plist
          IPA=$(ls -1 build/ios/ipa/*.ipa | head -1)
          echo "Ad Hoc IPA: $IPA"
          if unzip -l "$IPA" | grep -q 'kernel_blob.bin'; then
            echo "ERROR: Debug IPA"
            exit 1
          fi
          TMP=$(mktemp -d)
          unzip -q "$IPA" -d "$TMP"
          PROV=$(find "$TMP" -name embedded.mobileprovision | head -1)
          if [ -z "$PROV" ]; then
            echo "ERROR: embedded.mobileprovision yok"
            exit 1
          fi
          security cms -D -i "$PROV" > /tmp/provision.plist
          if ! grep -q "$DEVICE_UDID" /tmp/provision.plist; then
            echo "ERROR: UDID $DEVICE_UDID profilde yok"
            plutil -p /tmp/provision.plist | head -80 || true
            exit 1
          fi
          echo "OK: UDID profilde — Diawi ile kur"
          ls -lh build/ios/ipa/
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - alikayracatalkaya321@gmail.com
        notify:
          success: true
          failure: true
