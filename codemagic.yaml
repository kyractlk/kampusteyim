# Windows'tan iOS: Codemagic bulut Mac
# Team: 8496F2PR53 · Bundle: com.aystech.mtMobil
# SPM kapalı → CocoaPods (permission_handler Podfile flags)
#
# KRİTİK: App Store’a yalnızca --release IPA.
# Debug IPA home screen’den açılmaz (Guideline 2.1) ve
# iOS 26.5 ProMotion’da VSyncClient ile çöker (#187565).

workflows:
  ios-app-store:
    name: KampusteyimAPP iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: KampusteyimASC
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.aystech.mtMobil
      vars:
        BUNDLE_ID: com.aystech.mtMobil
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Disable Swift Package Manager (use CocoaPods)
        script: |
          flutter config --no-enable-swift-package-manager
      - name: Code signing (automatic profiles)
        script: xcode-project use-profiles
      - name: Flutter pub get
        script: |
          flutter clean
          flutter pub get
          flutter --version
      - name: CocoaPods install
        script: |
          cd ios
          rm -rf Pods Podfile.lock .symlinks
          pod install --repo-update
      - name: Build number
        script: |
          # App Store’da son yüklenen cfBundleVersion = 12 → her zaman daha yüksek olmalı
          BN="${BUILD_NUMBER:-14}"
          if [ "$BN" -le 13 ]; then BN=14; fi
          sed -i '' -E "s/^version: ([0-9]+\.[0-9]+\.[0-9]+)\+.*/version: \1+$BN/" pubspec.yaml
          grep '^version:' pubspec.yaml
      - name: Flutter IPA RELEASE only
        script: |
          set -e
          echo "Building RELEASE IPA (never Debug)…"
          if grep -q "UIApplicationSceneManifest" ios/Runner/Info.plist; then
            echo "ERROR: UIApplicationSceneManifest still in Info.plist"
            exit 1
          fi
          if ! grep -q "installTouchRateCorrectionNoOp\|touch-rate VSync" ios/Runner/AppDelegate.swift; then
            echo "ERROR: ProMotion VSync workaround missing from AppDelegate"
            exit 1
          fi
          flutter build ipa --release \
            --no-tree-shake-icons \
            --export-options-plist=/Users/builder/export_options.plist
          IPA=$(ls -1 build/ios/ipa/*.ipa | head -1)
          echo "IPA: $IPA"
          if unzip -l "$IPA" | grep -q 'kernel_blob.bin'; then
            echo "ERROR: Debug kernel_blob.bin in IPA — aborting"
            exit 1
          fi
          echo "Release IPA OK — TestFlight upload next"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - alikayracatalkaya321@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  # Telefona manuel kurulum (TestFlight olmadan) — Ad Hoc
  # Cihaz: Kayra iPhone 15 Plus · UDID ios/devices/adhoc_udids.txt
  ios-ad-hoc:
    name: KampusteyimAPP iOS → Ad Hoc (cihazına kur)
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: KampusteyimASC
    environment:
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.aystech.mtMobil
      vars:
        BUNDLE_ID: com.aystech.mtMobil
        # Kayra iPhone 15 Plus (udid.tech)
        DEVICE_UDID: 00008120-000631242151A01E
        DEVICE_NAME: Kayra-iPhone15-Plus
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Register test device (Ad Hoc)
        script: |
          set +e
          app-store-connect devices register \
            --name "$DEVICE_NAME" \
            --udid "$DEVICE_UDID"
          echo "Device register exit: $? (already registered = OK)"
          set -e
          echo "Registered / confirmed UDID: $DEVICE_UDID"
      - name: Disable Swift Package Manager
        script: flutter config --no-enable-swift-package-manager
      - name: Fetch / create Ad Hoc signing + profiles
        script: |
          set -e
          keychain initialize
          # Eski Ad Hoc profil UDID’siz kalmasın → sil + yeniden oluştur
          set +e
          app-store-connect profiles list --type ad_hoc --json > /tmp/adhoc_profiles.json 2>/dev/null
          python3 - <<'PY' || true
          import json, subprocess, os
          try:
            data = json.load(open("/tmp/adhoc_profiles.json"))
          except Exception:
            raise SystemExit(0)
          bid = os.environ.get("BUNDLE_ID", "com.aystech.mtMobil")
          items = data if isinstance(data, list) else data.get("profiles") or data.get("data") or []
          for p in items:
            if isinstance(p, dict):
              name = str(p.get("name") or p.get("attributes", {}).get("name") or "")
              pid = str(p.get("id") or p.get("profileId") or "")
              bundle = str(p.get("bundleId") or p.get("attributes", {}).get("bundleId") or "")
              if bid in name or bid in bundle or "ad hoc" in name.lower() or "adhoc" in name.lower().replace("-", ""):
                if pid:
                  print(f"Deleting old profile {pid} ({name})")
                  subprocess.call(["app-store-connect", "profiles", "delete", pid])
          PY
          set -e
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type ad_hoc \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Flutter pub get
        script: |
          flutter clean
          flutter pub get
      - name: CocoaPods
        script: |
          cd ios
          rm -rf Pods Podfile.lock .symlinks
          pod install --repo-update
      - name: Build number
        script: |
          BN="${BUILD_NUMBER:-14}"
          if [ "$BN" -le 13 ]; then BN=14; fi
          sed -i '' -E "s/^version: ([0-9]+\.[0-9]+\.[0-9]+)\+.*/version: \1+$BN/" pubspec.yaml
          grep '^version:' pubspec.yaml
      - name: Flutter Ad Hoc RELEASE IPA
        script: |
          set -e
          flutter build ipa --release \
            --no-tree-shake-icons \
            --export-options-plist=/Users/builder/export_options.plist
          IPA=$(ls -1 build/ios/ipa/*.ipa | head -1)
          echo "Ad Hoc IPA: $IPA"
          if unzip -l "$IPA" | grep -q 'kernel_blob.bin'; then
            echo "ERROR: Debug IPA"
            exit 1
          fi
          # UDID gerçekten IPA içinde mi? (bütünlük hatasının #1 sebebi)
          TMP=$(mktemp -d)
          unzip -q "$IPA" -d "$TMP"
          PROV=$(find "$TMP" -name embedded.mobileprovision | head -1)
          if [ -z "$PROV" ]; then
            echo "ERROR: embedded.mobileprovision yok — App Store IPA olabilir, Ad Hoc değil"
            exit 1
          fi
          security cms -D -i "$PROV" > /tmp/provision.plist
          echo "----- ProvisionedDevices -----"
          plutil -extract ProvisionedDevices xml1 -o - /tmp/provision.plist 2>/dev/null || true
          if ! grep -q "$DEVICE_UDID" /tmp/provision.plist; then
            echo "ERROR: UDID $DEVICE_UDID bu IPA'nın Ad Hoc profilinde YOK"
            echo "InstallOnAir 'bütünlük' hatası bundan olur. Profil yeniden oluşturulmalı."
            exit 1
          fi
          echo "OK: UDID profilde — InstallOnAir/Diawi ile kurulabilir"
          ls -lh build/ios/ipa/
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - alikayracatalkaya321@gmail.com
        notify:
          success: true
          failure: true
